<app-page-hero
  eyebrow="Expertise"
  title="Skills & Technologies"
  subtitle="A comprehensive toolkit for building modern, scalable applications."
/>

<section class="section">
  <div class="container">
    @for (category of getSkillCategories(); track category.key; let catIndex = $index) {
      <div class="skill-category" appScrollAnimate animation="fade-up" [delay]="catIndex * 100">
        <app-section-header
          [eyebrow]="category.label"
          [title]="category.label + ' Development'"
          [description]="'Proficiency in ' + category.label.toLowerCase() + ' technologies and frameworks.'"
          [titleId]="'skills-' + category.key"
        />

        <div class="skills-grid">
          @for (skill of category.skills; track skill.name; let i = $index) {
            <div class="skill-card card-surface" appScrollAnimate animation="fade-up" [delay]="i * 50">
              <div class="skill-card__header">
                <span class="skill-card__name">
                  @if (skill.icon) {
                    <i [class]="skill.icon" aria-hidden="true"></i>
                  }
                  {{ skill.name }}
                </span>
                <span class="skill-card__level" aria-label="{{ skill.name }} proficiency {{ skill.level }} percent">
                  {{ skill.level }}%
                </span>
              </div>
              <p-progressBar
                [value]="skill.level"
                [showValue]="false"
                [attr.aria-label]="skill.name + ' skill level ' + skill.level + ' percent'"
              />
            </div>
          }
        </div>
      </div>
    }
  </div>
</section>
